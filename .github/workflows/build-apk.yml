name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jq for JSON parsing
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Build APK with EAS
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        working-directory: mobile
        run: |
          BUILD_ID=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')
          eas build:download --id $BUILD_ID --output ../reels-kaydirici.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reels-kaydirici-${{ github.sha }}
          path: reels-kaydirici.apk
          retention-days: 30
